[package]
name = "neemu-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "neemu TUI — media-extraction console (fleet TUI pattern D2, rung 1)"

[[bin]]
name = "neemu-tui"
path = "src/main.rs"

[dependencies]
neemu = { path = "../.." }
serde_json = "1"
ratatui = "0.30"
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "pnm"] }
